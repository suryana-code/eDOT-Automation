name: Automation Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Pilih suite yang akan dijalankan"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - playwright
          - maestro

permissions:
  contents: read

concurrency:
  group: automation
  cancel-in-progress: true

# ================================================================
# PLAYWRIGHT
# ================================================================

jobs:
  playwright:
    if: >
      github.event_name == 'push' ||
      inputs.test_suite == 'all' ||
      inputs.test_suite == 'playwright'

    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.playwright.outcome }}

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # PLAYWRIGHT DEPENDENCIES
      # ============================================================

      - name: Install Playwright Dependencies
        working-directory: Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # PLAYWRIGHT BROWSERS
      # ============================================================

      - name: Install Playwright Browsers
        working-directory: Playwright
        run: |
          playwright install --with-deps

      # ============================================================
      # RUN PLAYWRIGHT
      # ============================================================

      - name: Run Playwright Automation
        id: playwright
        continue-on-error: true
        working-directory: Playwright
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.allure/playwright-results"

          pytest -v -s \
            --alluredir="$GITHUB_WORKSPACE/.allure/playwright-results"

      # ============================================================
      # UPLOAD PLAYWRIGHT RESULTS
      # ============================================================

      - name: Upload Playwright Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results/
          if-no-files-found: warn

  # ================================================================
  # MAESTRO
  # ================================================================

  maestro:
    if: >
      github.event_name == 'push' ||
      inputs.test_suite == 'all' ||
      inputs.test_suite == 'maestro'

    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.maestro.outcome }}

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # MAESTRO DEPENDENCIES
      # ============================================================

      - name: Install Maestro Dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # MAESTRO CLI
      # ============================================================

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # ============================================================
      # DOWNLOAD APK
      # ============================================================

      - name: Download and verify Maestro APK
        shell: bash
        run: |
          set -euo pipefail

          APK_ZIP="$GITHUB_WORKSPACE/edot-maestro-apk.zip"
          APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "========================================"
          echo "DOWNLOAD APK"
          echo "========================================"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          echo "Downloaded ZIP:"
          ls -lh "$APK_ZIP"

          echo "========================================"
          echo "VERIFY SHA-256"
          echo "========================================"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: MAESTRO_APK_SHA256 is empty"
            exit 1
          fi

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_ZIP" \
            | sha256sum --check --status

          echo "SHA-256 verification passed"

          echo "========================================"
          echo "EXTRACT APK"
          echo "========================================"

          unzip -q "$APK_ZIP" -d "$APK_DIR"

          echo "Extracted files:"
          find "$APK_DIR" -maxdepth 1 -type f -print

          echo "========================================"
          echo "VERIFY APK FILES"
          echo "========================================"

          test -f "$APK_DIR/base.apk"
          test -f "$APK_DIR/split_config.arm64_v8a.apk"
          test -f "$APK_DIR/split_config.xxhdpi.apk"

          echo "All APK files verified."

          ls -lh \
            "$APK_DIR/base.apk" \
            "$APK_DIR/split_config.arm64_v8a.apk" \
            "$APK_DIR/split_config.xxhdpi.apk"

      # ============================================================
      # ENABLE KVM
      # ============================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm

      # ============================================================
      # PREPARE MAESTRO ALLURE DIRECTORY
      # Dibuat di luar emulator agar selalu ada meski script emulator gagal
      # ============================================================

      - name: Prepare Maestro Allure directory
        run: mkdir -p "$GITHUB_WORKSPACE/.allure/maestro-results"

      # ============================================================
      # START EMULATOR + MAESTRO
      # ============================================================

      - name: Start emulator and run Maestro
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5

          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back emulated
            -camera-front emulated
            -no-snapshot-save

          script: |
            # set -e dihapus agar script tidak abort sebelum pytest sempat jalan.
            # Error handling dilakukan secara eksplisit per section kritis.

            echo "========================================"
            echo "ANDROID ENVIRONMENT"
            echo "========================================"

            adb devices
            adb wait-for-device

            echo "========================================"
            echo "RESET EMULATOR STATE"
            echo "========================================"

            # Stop application if it is running
            adb shell am force-stop "$APP_ID" || true

            # Clear application data
            adb shell pm clear "$APP_ID" || true

            echo "Application state cleared"

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist

            echo "Screen Resolution & Density:"
            adb shell wm size
            adb shell wm density


            # ========================================================
            # VERIFY ENVIRONMENT
            # ========================================================

            echo "========================================"
            echo "VERIFY ENVIRONMENT"
            echo "========================================"

            test -n "$APP_ID"
            test -n "$COMPANY_ID"
            test -n "$USER_NAME"
            test -n "$PASSWORD"

            echo "Environment variables are configured"


            # ========================================================
            # INSTALL APPLICATION
            # ========================================================

            echo "========================================"
            echo "INSTALL APPLICATION"
            echo "========================================"

            adb install-multiple -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.arm64_v8a.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk" || adb install-multiple -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk" || adb install -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk"

            echo "Application installed successfully"


            # ========================================================
            # VERIFY PACKAGE
            # ========================================================

            echo "========================================"
            echo "VERIFY PACKAGE"
            echo "========================================"

            adb shell pm path "$APP_ID" || echo "WARNING: package not fully verified, continuing anyway"


            # ========================================================
            # LAUNCH APPLICATION
            # ========================================================

            echo "========================================"
            echo "LAUNCH APPLICATION"
            echo "========================================"

            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1

            echo "Application launched, waiting for UI initialization..."
            sleep 15


            # ========================================================
            # DISABLE AUTOFILL
            # ========================================================

            echo "========================================"
            echo "DISABLE AUTOFILL"
            echo "========================================"

            adb shell settings put secure autofill_service null || true
            echo "Autofill disabled"


            # ========================================================
            # VERIFY MAESTRO PROJECT
            # ========================================================

            echo "========================================"
            echo "VERIFY MAESTRO PROJECT"
            echo "========================================"

            test -d "$GITHUB_WORKSPACE/Maestro"
            test -f "$GITHUB_WORKSPACE/Maestro/Makefile"
            test -f "$GITHUB_WORKSPACE/Maestro/pytest/test_mobile.py"

            echo "Maestro project verified"


            # ========================================================
            # RUN MAESTRO TEST
            # ========================================================

            echo "========================================"
            echo "RUN MAESTRO TEST"
            echo "========================================"

            mkdir -p "$GITHUB_WORKSPACE/.allure/maestro-results"

            cd "$GITHUB_WORKSPACE/Maestro" && pytest -v -s pytest/test_mobile.py --alluredir="$GITHUB_WORKSPACE/.allure/maestro-results"

      # ============================================================
      # FALLBACK ALLURE RESULT
      # Jika emulator script gagal sebelum pytest jalan, buat synthetic result
      # agar artifact maestro-allure-results selalu ter-upload dan Pages
      # tetap menampilkan suite Maestro di combined report.
      # ============================================================

      - name: Create fallback Allure result if no Maestro results
        if: always()
        run: |
          python3 -c "
          import glob, json, os, time, uuid

          results_dir = os.path.join(os.environ.get('GITHUB_WORKSPACE', '.'), '.allure', 'maestro-results')
          os.makedirs(results_dir, exist_ok=True)

          json_files = glob.glob(os.path.join(results_dir, '*-result.json'))
          if json_files:
              print(f'Maestro allure results found ({len(json_files)} files). No fallback needed.')
          else:
              print('No Maestro results found. Creating fallback broken result.')
              uuid_str = str(uuid.uuid4())
              now_ms = int(time.time() * 1000)

              data = {
                  'uuid': uuid_str,
                  'name': 'Maestro Mobile Suite',
                  'fullName': 'Maestro.MobileSuite',
                  'status': 'broken',
                  'statusDetails': {
                      'message': 'Maestro did not produce test results. Emulator setup or test execution failed before pytest could run.',
                      'trace': 'Check the Start emulator and run Maestro step logs and Maestro debug artifacts for details.'
                  },
                  'stage': 'finished',
                  'start': now_ms,
                  'stop': now_ms,
                  'labels': [
                      {'name': 'parentSuite', 'value': 'Maestro'},
                      {'name': 'suite', 'value': 'Mobile Automation'},
                      {'name': 'story', 'value': 'Mobile Automation - eWork SFA'}
                  ],
                  'links': [],
                  'steps': [],
                  'attachments': [],
                  'parameters': []
              }

              out_path = os.path.join(results_dir, f'{uuid_str}-result.json')
              with open(out_path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
              print(f'Fallback result created: {out_path}')
          "

      # ============================================================
      # MAESTRO DEBUG FILES
      # ============================================================

      - name: Show Maestro debug files
        if: always()
        run: |
          echo "========================================"
          echo "MAESTRO DEBUG FILES"
          echo "========================================"

          if [ -d "$HOME/.maestro" ]; then
            find "$HOME/.maestro" \
              -maxdepth 4 \
              -type f \
              -print
          else
            echo "No Maestro debug directory found"
          fi

      # ============================================================
      # UPLOAD MAESTRO RESULTS
      # ============================================================

      - name: Upload Maestro Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results/
          if-no-files-found: warn

      # ============================================================
      # MAESTRO EVIDENCE
      # ============================================================

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

      # ============================================================
      # MAESTRO DEBUG ARTIFACTS
      # ============================================================

      - name: Upload Maestro debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: /home/runner/.maestro/
          include-hidden-files: true
          if-no-files-found: warn

  # ================================================================
  # COMBINED ALLURE REPORT
  # ================================================================

  report:
    needs:
      - playwright
      - maestro

    if: >
      always() &&
      (needs.playwright.result != 'skipped' || needs.maestro.result != 'skipped')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # ============================================================
      # SETUP
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # ALLURE
      # ============================================================

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline
          allure --version

      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare Allure directories
        run: |
          rm -rf .allure

          mkdir -p .allure/playwright-results
          mkdir -p .allure/maestro-results
          mkdir -p .allure/results
          mkdir -p .allure/report

      # ============================================================
      # DOWNLOAD PLAYWRIGHT RESULTS
      # ============================================================

      - name: Download Playwright results
        if: always() && needs.playwright.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results
        continue-on-error: true

      # ============================================================
      # DOWNLOAD MAESTRO RESULTS
      # ============================================================

      - name: Download Maestro results
        if: always() && needs.maestro.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results
        continue-on-error: true

      # ============================================================
      # MERGE RESULTS
      # ============================================================

      - name: Merge Allure results
        if: always()
        run: |
          echo "========================================"
          echo "MERGE ALLURE RESULTS"
          echo "========================================"

          cp -R \
            .allure/playwright-results/. \
            .allure/results/ \
            2>/dev/null || true

          cp -R \
            .allure/maestro-results/. \
            .allure/results/ \
            2>/dev/null || true

          echo ""
          echo "Combined result files:"

          find .allure/results \
            -maxdepth 1 \
            -type f \
            -print || true

      # ============================================================
      # GENERATE ALLURE
      # ============================================================

      - name: Generate combined Allure report
        if: always()
        run: |
          echo "========================================"
          echo "GENERATE ALLURE REPORT"
          echo "========================================"

          allure generate \
            .allure/results \
            --clean \
            -o .allure/report

      # ============================================================
      # UPLOAD COMBINED RESULTS
      # ============================================================

      - name: Upload combined Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-results
          path: .allure/results/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD COMBINED REPORT
      # ============================================================

      - name: Upload combined Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: .allure/report/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD GITHUB PAGES
      # ============================================================

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .allure/report

  # ================================================================
  # DEPLOY GITHUB PAGES
  # ================================================================

  deploy:
    needs: report

    if: always() && needs.report.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ================================================================
  # QUALITY GATE
  # ================================================================

  quality-gate:
    needs:
      - playwright
      - maestro
      - report
      - deploy

    if: >
      always() &&
      (needs.playwright.result != 'skipped' || needs.maestro.result != 'skipped')

    runs-on: ubuntu-latest

    steps:
      - name: Set final workflow status
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.outputs.test_result }}
          MAESTRO_RESULT: ${{ needs.maestro.outputs.test_result }}
          REPORT_RESULT: ${{ needs.report.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          echo "========================================"
          echo "AUTOMATION SUMMARY"
          echo "========================================"
          echo "Playwright: ${PLAYWRIGHT_RESULT:-skipped}"
          echo "Maestro:    ${MAESTRO_RESULT:-skipped}"
          echo "Report:     $REPORT_RESULT"
          echo "Deploy:     ${DEPLOY_RESULT:-skipped}"
          echo "========================================"

          if [ "$PLAYWRIGHT_RESULT" = "failure" ] || [ "$MAESTRO_RESULT" = "failure" ]; then
            echo "One or more test suites failed."
            exit 1
          fi

          if [ "$REPORT_RESULT" != "success" ]; then
            echo "Report generation failed."
            exit 1
          fi

          if [ "$DEPLOY_RESULT" = "failure" ]; then
            echo "GitHub Pages deployment failed."
            exit 1
          fi

          echo "All checks passed."
