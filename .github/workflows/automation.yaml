name: Automation Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: PLAYWRIGHT (WEB AUTOMATION) - RUN PARALLEL
  # ============================================================
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Playwright Dependencies
        working-directory: Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright Automation
        id: playwright
        working-directory: Playwright
        continue-on-error: true
        run: |
          pytest -v -s --alluredir=../.allure/playwright-results

      - name: Upload Playwright Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results/
          if-no-files-found: warn

  # ============================================================
  # JOB 2: MAESTRO (MOBILE AUTOMATION) - RUN PARALLEL
  # ============================================================
  maestro:
    name: Run Maestro Tests
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python Dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Maestro CLI
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Download and Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_ZIP="$GITHUB_WORKSPACE/edot-maestro-apk.zip"
          APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"
          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          curl --fail --location --retry 3 --retry-all-errors --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"
          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: MAESTRO_APK_SHA256 is empty"
            exit 1
          fi
          printf '%s  %s\n' "$APK_SHA256" "$APK_ZIP" | sha256sum --check --status
          unzip -q "$APK_ZIP" -d "$APK_DIR"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Emulator and Run Maestro
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back emulated
            -camera-front emulated
            -no-snapshot-save
          script: |
            adb devices
            adb wait-for-device
            adb shell am force-stop "$APP_ID" || true
            adb shell pm clear "$APP_ID" || true

            adb install-multiple -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.arm64_v8a.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk" || adb install-multiple -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk" || adb install -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk"

            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell settings put secure autofill_service null || true

            # Menjalankan Pytest Maestro dengan output alluredir
            cd "$GITHUB_WORKSPACE/Maestro"
            pytest -v -s pytest/test_mobile.py --alluredir="$GITHUB_WORKSPACE/.allure/maestro-results"

      - name: Upload Maestro Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results/
          if-no-files-found: warn

      - name: Upload Maestro Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

  # ============================================================
  # JOB 3: MERGE ALLURE REPORTS & DEPLOY TO GITHUB PAGES
  # ============================================================
  publish-report:
    name: Merge Allure Reports & Deploy Pages
    needs: [playwright, maestro]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline
          allure --version

      - name: Prepare Combined Allure Directory
        run: |
          rm -rf .allure
          mkdir -p .allure/results

      - name: Download Playwright Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-allure-results
          path: .allure/playwright-results

      - name: Download Maestro Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maestro-allure-results
          path: .allure/maestro-results

      - name: Combine Allure Results
        run: |
          if [ -d ".allure/playwright-results" ]; then
            cp -R .allure/playwright-results/. .allure/results/ || true
          fi
          if [ -d ".allure/maestro-results" ]; then
            cp -R .allure/maestro-results/. .allure/results/ || true
          fi
          echo "Combined Allure JSON files:"
          ls -la .allure/results/

      - name: Generate Combined Allure Report
        run: |
          allure generate .allure/results --clean -o .allure/report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .allure/report

  # ============================================================
  # JOB 4: DEPLOYMENT TO GITHUB PAGES
  # ============================================================
  deploy-pages:
    name: Deploy Allure Report to GitHub Pages
    needs: publish-report
    if: always()
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
