name: Automation Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # GITHUB PAGES SETUP
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # PLAYWRIGHT DEPENDENCIES
      # ============================================================

      - name: Install Playwright Dependencies
        working-directory: Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # ============================================================
      # MAESTRO PYTHON DEPENDENCIES & CLI
      # ============================================================

      - name: Install Maestro Dependencies & CLI
        run: |
          python -m pip install --upgrade pip
          if [ -f Maestro/requirements.txt ]; then
            pip install -r Maestro/requirements.txt
          fi
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # ============================================================
      # ALLURE CLI
      # ============================================================

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline
          allure --version

      # ============================================================
      # PREPARE ALLURE DIRECTORIES
      # ============================================================

      - name: Prepare Allure directories
        run: |
          rm -rf .allure
          mkdir -p .allure/playwright-results
          mkdir -p .allure/maestro-results
          mkdir -p .allure/results
          mkdir -p .allure/report

      # ============================================================
      # 1. RUN PLAYWRIGHT AUTOMATION
      # ============================================================

      - name: Run Playwright Automation
        id: playwright
        working-directory: Playwright
        continue-on-error: true
        run: |
          pytest -v -s --alluredir=../.allure/playwright-results

      # ============================================================
      # DOWNLOAD MAESTRO APK
      # ============================================================

      - name: Download and verify Maestro APK
        shell: bash
        run: |
          set -euo pipefail

          APK_ZIP="$GITHUB_WORKSPACE/edot-maestro-apk.zip"
          APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: MAESTRO_APK_SHA256 is empty"
            exit 1
          fi

          printf '%s  %s\n' "$APK_SHA256" "$APK_ZIP" | sha256sum --check --status
          unzip -q "$APK_ZIP" -d "$APK_DIR"
          echo "APK verification passed"

      # ============================================================
      # ENABLE KVM FOR EMULATOR
      # ============================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ============================================================
      # 2. RUN MAESTRO AUTOMATION
      # ============================================================

      - name: Start emulator and run Maestro
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back emulated
            -camera-front emulated
            -no-snapshot-save

          script: |
            set -e

            adb devices
            adb wait-for-device

            adb shell am force-stop "$APP_ID" || true
            adb shell pm clear "$APP_ID" || true

            APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

            adb install-multiple -r "$APK_DIR/base.apk" "$APK_DIR/split_config.arm64_v8a.apk" "$APK_DIR/split_config.xxhdpi.apk" || adb install-multiple -r "$APK_DIR/base.apk" "$APK_DIR/split_config.xxhdpi.apk" || adb install -r "$APK_DIR/base.apk"

            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell settings put secure autofill_service null || true

            cd "$GITHUB_WORKSPACE/Maestro"
            if [ -f "Makefile" ]; then
              make test || pytest -v -s pytest/test_mobile.py --alluredir=../.allure/maestro-results
            else
              pytest -v -s pytest/test_mobile.py --alluredir=../.allure/maestro-results
            fi

      # ============================================================
      # MERGE ALLURE RESULTS
      # ============================================================

      - name: Merge Allure results
        if: always()
        run: |
          echo "========================================"
          echo "MERGING ALLURE RESULTS"
          echo "========================================"

          rm -rf .allure/results
          mkdir -p .allure/results

          # Copy Playwright Results
          if [ -d ".allure/playwright-results" ]; then
            echo "Copying Playwright results..."
            cp -R .allure/playwright-results/. .allure/results/ || true
          fi

          # Copy Maestro Results (Pengecekan di 2 lokasi path)
          if [ -d ".allure/maestro-results" ]; then
            echo "Copying Maestro results from .allure/maestro-results..."
            cp -R .allure/maestro-results/. .allure/results/ || true
          fi
          if [ -d "Maestro/allure-results" ]; then
            echo "Copying Maestro results from Maestro/allure-results..."
            cp -R Maestro/allure-results/. .allure/results/ || true
          fi

          echo "Total JSON results merged:"
          find .allure/results -name '*-result.json' | wc -l

      # ============================================================
      # GENERATE COMBINED ALLURE REPORT
      # ============================================================

      - name: Generate combined Allure report
        if: always()
        run: |
          echo "========================================"
          echo "GENERATE COMBINED ALLURE REPORT"
          echo "========================================"

          rm -rf .allure/report

          allure generate \
            .allure/results \
            --clean \
            -o .allure/report

      # ============================================================
      # UPLOAD GITHUB PAGES ARTIFACT
      # ============================================================

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .allure/report

  # ================================================================
  # DEPLOY TO GITHUB PAGES JOB
  # ================================================================

  deploy:
    needs: automation
    if: always()
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
