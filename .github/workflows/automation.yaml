name: Automation Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - maestro
          - playwright

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: automation-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # PLAYWRIGHT
  # ============================================================

  playwright:
    name: Playwright Automation
    if: >
      github.event_name == 'push' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'playwright'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install dependencies
        working-directory: Playwright
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # --------------------------------------------------------
      # INSTALL PLAYWRIGHT
      # --------------------------------------------------------

      - name: Install Playwright browsers
        working-directory: Playwright
        run: |
          python -m playwright install --with-deps

      # --------------------------------------------------------
      # PREPARE ALLURE
      # --------------------------------------------------------

      - name: Prepare Playwright Allure directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/.allure/playwright-results"
          mkdir -p "$GITHUB_WORKSPACE/.allure/playwright-results"

      # --------------------------------------------------------
      # RUN PLAYWRIGHT
      # --------------------------------------------------------

      - name: Run Playwright tests
        working-directory: Playwright
        env:
          APP_ID: ${{ secrets.APP_ID }}
          COMPANY_ID: ${{ secrets.COMPANY_ID }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          pytest -v -s \
            --alluredir="$GITHUB_WORKSPACE/.allure/playwright-results"

      # --------------------------------------------------------
      # VERIFY RESULT
      # --------------------------------------------------------

      - name: Verify Playwright Allure Results
        if: always()
        run: |
          echo "========================================"
          echo "PLAYWRIGHT ALLURE RESULTS"
          echo "========================================"

          find "$GITHUB_WORKSPACE/.allure/playwright-results" \
            -type f -print || true

          COUNT=$(find "$GITHUB_WORKSPACE/.allure/playwright-results" \
            -type f | wc -l)

          echo ""
          echo "Playwright result files: $COUNT"

      # --------------------------------------------------------
      # UPLOAD ALLURE RESULT
      # --------------------------------------------------------

      - name: Upload Playwright Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results/
          if-no-files-found: warn


  # ============================================================
  # MAESTRO
  # ============================================================

  maestro:
    name: Maestro Automation
    if: >
      github.event_name == 'push' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'maestro'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # JAVA
      # --------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # --------------------------------------------------------
      # INSTALL PYTHON DEPENDENCIES
      # --------------------------------------------------------

      - name: Install Python dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # --------------------------------------------------------
      # INSTALL MAESTRO
      # --------------------------------------------------------

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash

          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # PREPARE ALLURE
      # --------------------------------------------------------

      - name: Prepare Maestro Allure directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/.allure/maestro-results"
          mkdir -p "$GITHUB_WORKSPACE/.allure/maestro-results"

      # ========================================================
      # START EMULATOR + MAESTRO
      # ========================================================

      - name: Start emulator and run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: ${{ secrets.APP_ID }}
          COMPANY_ID: ${{ secrets.COMPANY_ID }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_8
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |

            echo "========================================"
            echo "ANDROID ENVIRONMENT"
            echo "========================================"

            adb devices
            adb wait-for-device

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist

            echo "Screen Resolution:"
            adb shell wm size

            echo "Screen Density:"
            adb shell wm density


            # ====================================================
            # VERIFY ENVIRONMENT
            # ====================================================

            echo "========================================"
            echo "VERIFY ENVIRONMENT"
            echo "========================================"

            test -n "$APP_ID"
            test -n "$COMPANY_ID"
            test -n "$USER_NAME"
            test -n "$PASSWORD"

            echo "Environment variables are configured"


            # ====================================================
            # VERIFY APK
            # ====================================================

            echo "========================================"
            echo "VERIFY APK"
            echo "========================================"

            APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

            test -f "$APK_DIR/base.apk"
            test -f "$APK_DIR/split_config.arm64_v8a.apk"
            test -f "$APK_DIR/split_config.xxhdpi.apk"

            echo "APK files verified"

            ls -lah "$APK_DIR"


            # ====================================================
            # INSTALL APPLICATION
            # ====================================================

            echo "========================================"
            echo "INSTALL APPLICATION"
            echo "========================================"

            adb install-multiple -r \
              "$APK_DIR/base.apk" \
              "$APK_DIR/split_config.arm64_v8a.apk" \
              "$APK_DIR/split_config.xxhdpi.apk" \
              || \
            adb install-multiple -r \
              "$APK_DIR/base.apk" \
              "$APK_DIR/split_config.xxhdpi.apk" \
              || \
            adb install -r "$APK_DIR/base.apk"

            echo "Application installed successfully"


            # ====================================================
            # VERIFY PACKAGE
            # ====================================================

            echo "========================================"
            echo "VERIFY PACKAGE"
            echo "========================================"

            adb shell pm path "$APP_ID"


            # ====================================================
            # LAUNCH APPLICATION
            # ====================================================

            echo "========================================"
            echo "LAUNCH APPLICATION"
            echo "========================================"

            adb shell monkey \
              -p "$APP_ID" \
              -c android.intent.category.LAUNCHER \
              1

            echo "Application launched"

            sleep 15


            # ====================================================
            # DISABLE AUTOFILL
            # ====================================================

            echo "========================================"
            echo "DISABLE AUTOFILL"
            echo "========================================"

            adb shell settings put secure autofill_service null || true

            echo "Autofill disabled"


            # ====================================================
            # VERIFY MAESTRO PROJECT
            # ====================================================

            echo "========================================"
            echo "VERIFY MAESTRO PROJECT"
            echo "========================================"

            test -d "$GITHUB_WORKSPACE/Maestro"
            test -f "$GITHUB_WORKSPACE/Maestro/Makefile"
            test -f "$GITHUB_WORKSPACE/Maestro/pytest/test_mobile.py"

            echo "Maestro project verified"


            # ====================================================
            # RUN MAESTRO TEST
            # ====================================================

            echo "========================================"
            echo "RUN MAESTRO TEST"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/Maestro"

            make test


      # --------------------------------------------------------
      # COLLECT MAESTRO ALLURE RESULTS
      # --------------------------------------------------------

      - name: Collect Maestro Allure Results
        if: always()
        run: |
          echo "========================================"
          echo "SEARCHING MAESTRO ALLURE RESULTS"
          echo "========================================"

          mkdir -p "$GITHUB_WORKSPACE/.allure/maestro-results"

          find "$GITHUB_WORKSPACE/Maestro" \
            -type f \
            \( \
              -name "*-result.json" \
              -o \
              -name "container.json" \
            \) \
            -print || true

          echo ""
          echo "========================================"
          echo "COPY MAESTRO RESULTS"
          echo "========================================"

          find "$GITHUB_WORKSPACE/Maestro" \
            -type f \
            \( \
              -name "*-result.json" \
              -o \
              -name "container.json" \
            \) \
            -exec cp {} "$GITHUB_WORKSPACE/.allure/maestro-results/" \; \
            || true

          echo ""
          echo "========================================"
          echo "FINAL MAESTRO RESULTS"
          echo "========================================"

          find "$GITHUB_WORKSPACE/.allure/maestro-results" \
            -type f -print || true

          COUNT=$(find "$GITHUB_WORKSPACE/.allure/maestro-results" \
            -type f | wc -l)

          echo ""
          echo "Maestro result files: $COUNT"


      # --------------------------------------------------------
      # UPLOAD MAESTRO ALLURE RESULT
      # --------------------------------------------------------

      - name: Upload Maestro Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results/
          if-no-files-found: warn


  # ============================================================
  # COMBINED ALLURE REPORT
  # ============================================================

  allure-report:
    name: Generate Combined Allure Report

    if: always()

    needs:
      - playwright
      - maestro

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # DOWNLOAD PLAYWRIGHT RESULTS
      # --------------------------------------------------------

      - name: Download Playwright Allure Results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results
        continue-on-error: true

      # --------------------------------------------------------
      # DOWNLOAD MAESTRO RESULTS
      # --------------------------------------------------------

      - name: Download Maestro Allure Results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results
        continue-on-error: true

      # --------------------------------------------------------
      # VERIFY DOWNLOADED RESULTS
      # --------------------------------------------------------

      - name: Verify Allure Results
        if: always()
        run: |

          echo "========================================"
          echo "PLAYWRIGHT RESULTS"
          echo "========================================"

          find .allure/playwright-results \
            -type f -print 2>/dev/null || true


          echo ""
          echo "========================================"
          echo "MAESTRO RESULTS"
          echo "========================================"

          find .allure/maestro-results \
            -type f -print 2>/dev/null || true


      # --------------------------------------------------------
      # COMBINE RESULTS
      # --------------------------------------------------------

      - name: Combine Allure Results
        if: always()
        run: |

          rm -rf .allure/results
          mkdir -p .allure/results

          echo "========================================"
          echo "COPY PLAYWRIGHT RESULTS"
          echo "========================================"

          cp -R .allure/playwright-results/. \
            .allure/results/ \
            2>/dev/null || true


          echo "========================================"
          echo "COPY MAESTRO RESULTS"
          echo "========================================"

          cp -R .allure/maestro-results/. \
            .allure/results/ \
            2>/dev/null || true


          echo ""
          echo "========================================"
          echo "COMBINED RESULTS"
          echo "========================================"

          find .allure/results \
            -type f -print || true


          COUNT=$(find .allure/results \
            -type f | wc -l)

          echo ""
          echo "Total Allure result files: $COUNT"


      # --------------------------------------------------------
      # INSTALL ALLURE
      # --------------------------------------------------------

      - name: Install Allure
        if: always()
        run: |

          npm install -g allure-commandline


      # --------------------------------------------------------
      # GENERATE REPORT
      # --------------------------------------------------------

      - name: Generate Allure Report
        if: always()
        run: |

          rm -rf allure-report

          allure generate \
            .allure/results \
            --clean \
            -o allure-report


      # --------------------------------------------------------
      # UPLOAD REPORT ARTIFACT
      # --------------------------------------------------------

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report


  # ============================================================
  # DEPLOY GITHUB PAGES
  # ============================================================

  deploy:
    name: Deploy Allure Report

    if: always()

    needs:
      - allure-report

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
