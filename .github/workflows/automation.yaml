name: Automation Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select automation to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - playwright
          - maestro

permissions:
  contents: read

concurrency:
  group: automation
  cancel-in-progress: true

# ================================================================
# PLAYWRIGHT
# ================================================================

jobs:
  playwright:
    if: >
      github.event_name == 'push' ||
      inputs.test_suite == 'all' ||
      inputs.test_suite == 'playwright'

    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # PLAYWRIGHT DEPENDENCIES
      # ============================================================

      - name: Install Playwright Dependencies
        working-directory: Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # PLAYWRIGHT BROWSERS
      # ============================================================

      - name: Install Playwright Browsers
        working-directory: Playwright
        run: |
          playwright install --with-deps

      # ============================================================
      # RUN PLAYWRIGHT
      # ============================================================

      - name: Run Playwright Automation
        id: playwright
        continue-on-error: true
        working-directory: Playwright
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.allure/playwright-results"

          pytest -v -s \
            --alluredir="$GITHUB_WORKSPACE/.allure/playwright-results"

      # ============================================================
      # DEBUG: VERIFY PLAYWRIGHT RESULTS EXIST BEFORE UPLOAD
      # ============================================================

      - name: Verify Playwright Allure results
        if: always()
        run: |
          echo "========================================"
          echo "PLAYWRIGHT ALLURE RESULTS"
          echo "========================================"

          RESULT_DIR="$GITHUB_WORKSPACE/.allure/playwright-results"

          if [ -d "$RESULT_DIR" ]; then
            COUNT=$(find "$RESULT_DIR" -type f | wc -l)
            echo "Files found: $COUNT"
            find "$RESULT_DIR" -maxdepth 1 -type f -print
            if [ "$COUNT" -eq 0 ]; then
              echo "::warning::Playwright alluredir exists but is EMPTY. Report will not include Playwright results."
            fi
          else
            echo "::warning::Playwright alluredir does not exist at all."
          fi

      # ============================================================
      # UPLOAD PLAYWRIGHT RESULTS
      # ============================================================

      - name: Upload Playwright Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results/
          if-no-files-found: warn

  # ================================================================
  # MAESTRO
  # ================================================================

  maestro:
    if: >
      github.event_name == 'push' ||
      inputs.test_suite == 'all' ||
      inputs.test_suite == 'maestro'

    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # MAESTRO DEPENDENCIES
      # ============================================================

      - name: Install Maestro Dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # MAESTRO CLI
      # ============================================================

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # ============================================================
      # DOWNLOAD APK
      # ============================================================

      - name: Download and verify Maestro APK
        shell: bash
        run: |
          set -euo pipefail

          APK_ZIP="$GITHUB_WORKSPACE/edot-maestro-apk.zip"
          APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "========================================"
          echo "DOWNLOAD MAESTRO APK"
          echo "========================================"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          ls -lh "$APK_ZIP"

          echo "========================================"
          echo "VERIFY SHA-256"
          echo "========================================"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: MAESTRO_APK_SHA256 is empty"
            exit 1
          fi

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_ZIP" \
            | sha256sum --check --status

          echo "SHA-256 verification passed"

          echo "========================================"
          echo "EXTRACT APK"
          echo "========================================"

          unzip -q "$APK_ZIP" -d "$APK_DIR"

          test -f "$APK_DIR/base.apk"
          test -f "$APK_DIR/split_config.arm64_v8a.apk"
          test -f "$APK_DIR/split_config.xxhdpi.apk"

          echo "APK verification passed"

      # ============================================================
      # ENABLE KVM
      # ============================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm

      # ============================================================
      # ENSURE ALLURE OUTPUT DIR EXISTS BEFORE EMULATOR STEP
      # ============================================================

      - name: Prepare Maestro allure output directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.allure/maestro-results"

      # ============================================================
      # START EMULATOR + MAESTRO
      # ============================================================

      - name: Start emulator and run Maestro
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5

          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back emulated
            -camera-front emulated
            -no-snapshot-save

          script: |

            set -e

            echo "========================================"
            echo "ANDROID ENVIRONMENT"
            echo "========================================"

            adb devices
            adb wait-for-device

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist

            echo "Screen Resolution & Density:"
            adb shell wm size
            adb shell wm density


            # ========================================================
            # VERIFY ENVIRONMENT
            # ========================================================

            echo "========================================"
            echo "VERIFY MAESTRO ENVIRONMENT"
            echo "========================================"

            test -n "$APP_ID"
            test -n "$COMPANY_ID"
            test -n "$USER_NAME"
            test -n "$PASSWORD"

            echo "Environment variables are configured"


            # ========================================================
            # VERIFY APK
            # ========================================================

            echo "========================================"
            echo "VERIFY APK"
            echo "========================================"

            # NOTE: reactivecircus/android-emulator-runner executes each
            # line of this script as its own separate `/usr/bin/sh -c`
            # process, so a shell variable assigned on one line (like
            # APK_DIR used to be) is NOT visible on the next line. Every
            # command below uses the full literal path instead of an
            # intermediate variable.

            test -f "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk"
            test -f "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.arm64_v8a.apk"
            test -f "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk"

            ls -lh "$GITHUB_WORKSPACE/.ci/edot-apk"


            # ========================================================
            # INSTALL APPLICATION
            # ========================================================

            echo "========================================"
            echo "INSTALL APPLICATION"
            echo "========================================"

            adb install-multiple -r \
              "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk" \
              "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.arm64_v8a.apk" \
              "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk"

            echo "Application installed successfully"


            # ========================================================
            # VERIFY PACKAGE
            # ========================================================

            echo "========================================"
            echo "VERIFY PACKAGE"
            echo "========================================"

            adb shell pm path "$APP_ID"


            # ========================================================
            # LAUNCH APPLICATION
            # ========================================================

            echo "========================================"
            echo "LAUNCH APPLICATION"
            echo "========================================"

            adb shell monkey \
              -p "$APP_ID" \
              -c android.intent.category.LAUNCHER \
              1

            echo "Application launched"

            sleep 8


            # ========================================================
            # DISABLE AUTOFILL
            # ========================================================

            echo "========================================"
            echo "DISABLE AUTOFILL"
            echo "========================================"

            adb shell settings put secure autofill_service null || true

            echo "Autofill disabled"


            # ========================================================
            # RUN MAESTRO
            # ========================================================

            echo "========================================"
            echo "RUN MAESTRO TEST"
            echo "========================================"
            echo "Writing results to: $GITHUB_WORKSPACE/.allure/maestro-results"

            cd "$GITHUB_WORKSPACE/Maestro"

            # IMPORTANT: everything from `pytest` down to the final `||`
            # fallback must stay as ONE backslash-continued command. This
            # action runs each separate script line as its own isolated
            # process and aborts the whole script the instant any line
            # returns non-zero - so if pytest itself is written as a
            # standalone line and it fails (e.g. one test assertion
            # fails, which is normal), the script would die right there
            # and none of the diagnostics below would ever print. Piping
            # the failure into `|| echo ...` on the SAME continued line
            # makes the overall command's exit status 0, so execution
            # continues to the diagnostics regardless of test outcome.
            pytest -v -s \
              pytest/test_mobile.py \
              --alluredir="$GITHUB_WORKSPACE/.allure/maestro-results" \
              || echo "::warning::pytest exited non-zero - scroll up to the pytest output directly above this line for the real error/traceback"

            echo "========================================"
            echo "MAESTRO ALLURE RESULTS (inside emulator step)"
            echo "========================================"
            find "$GITHUB_WORKSPACE/.allure/maestro-results" -type f -print || true

            COUNT_INSIDE=$(find "$GITHUB_WORKSPACE/.allure/maestro-results" -type f | wc -l)
            echo "Result files written: $COUNT_INSIDE"

            if [ "$COUNT_INSIDE" -eq 0 ]; then
              echo "::warning::pytest wrote ZERO allure result files. Scroll up to the actual pytest output (above the 'RUN MAESTRO TEST' banner is wrong - look right below it) to see if this was a collection error, import error, wrong test path, or missing allure-pytest plugin."
            fi

      # ============================================================
      # DEBUG: VERIFY MAESTRO RESULTS EXIST BEFORE UPLOAD
      # ============================================================

      - name: Verify Maestro Allure results
        if: always()
        run: |
          echo "========================================"
          echo "MAESTRO ALLURE RESULTS"
          echo "========================================"

          RESULT_DIR="$GITHUB_WORKSPACE/.allure/maestro-results"

          if [ -d "$RESULT_DIR" ]; then
            COUNT=$(find "$RESULT_DIR" -type f | wc -l)
            echo "Files found: $COUNT"
            find "$RESULT_DIR" -maxdepth 1 -type f -print
            if [ "$COUNT" -eq 0 ]; then
              echo "::warning::Maestro alluredir exists but is EMPTY. This is why the combined report has no Maestro data."
            fi
          else
            echo "::warning::Maestro alluredir does not exist at all. pytest likely failed before writing any result."
          fi

      # ============================================================
      # MAESTRO DEBUG
      # ============================================================

      - name: Show Maestro debug files
        if: always()
        run: |
          if [ -d "$HOME/.maestro" ]; then
            find "$HOME/.maestro" \
              -maxdepth 4 \
              -type f \
              -print
          else
            echo "No Maestro debug directory found"
          fi

      # ============================================================
      # UPLOAD MAESTRO RESULTS
      # ============================================================

      - name: Upload Maestro Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results/
          if-no-files-found: warn

      # ============================================================
      # MAESTRO EVIDENCE
      # ============================================================

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

      # ============================================================
      # MAESTRO DEBUG
      # ============================================================

      - name: Upload Maestro debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: /home/runner/.maestro/
          include-hidden-files: true
          if-no-files-found: warn

  # ================================================================
  # COMBINED ALLURE REPORT
  # ================================================================

  report:
    needs:
      - playwright
      - maestro

    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    steps:
      # ============================================================
      # SETUP
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # ALLURE
      # ============================================================

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline
          allure --version

      # ============================================================
      # PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare Allure directories
        run: |
          rm -rf .allure

          mkdir -p .allure/playwright-results
          mkdir -p .allure/maestro-results
          mkdir -p .allure/results
          mkdir -p .allure/report

      # ============================================================
      # DOWNLOAD PLAYWRIGHT RESULTS
      # ============================================================

      - name: Download Playwright results
        if: always()
        id: download_playwright
        uses: actions/download-artifact@v4
        with:
          name: playwright-allure-results
          path: .allure/playwright-results
        continue-on-error: true

      # ============================================================
      # DOWNLOAD MAESTRO RESULTS
      # ============================================================

      - name: Download Maestro results
        if: always()
        id: download_maestro
        uses: actions/download-artifact@v4
        with:
          name: maestro-allure-results
          path: .allure/maestro-results
        continue-on-error: true

      # ============================================================
      # DEBUG: REPORT DOWNLOAD OUTCOME + FILE COUNTS
      # ============================================================

      - name: Verify downloaded results
        if: always()
        run: |
          echo "========================================"
          echo "DOWNLOAD STEP OUTCOMES"
          echo "========================================"
          echo "Playwright download outcome: ${{ steps.download_playwright.outcome }}"
          echo "Maestro download outcome:    ${{ steps.download_maestro.outcome }}"

          echo ""
          echo "Playwright files:"
          find .allure/playwright-results -type f | wc -l
          find .allure/playwright-results -maxdepth 1 -type f -print || true

          echo ""
          echo "Maestro files:"
          find .allure/maestro-results -type f | wc -l
          find .allure/maestro-results -maxdepth 1 -type f -print || true

          if [ "${{ steps.download_maestro.outcome }}" != "success" ]; then
            echo "::warning::Maestro artifact download did not succeed (outcome: ${{ steps.download_maestro.outcome }}). Check whether the 'maestro-allure-results' artifact was actually produced by the maestro job."
          fi

      # ============================================================
      # MERGE RESULTS
      # ============================================================

      - name: Merge Allure results
        if: always()
        run: |

          echo "========================================"
          echo "MERGE ALLURE RESULTS"
          echo "========================================"

          cp -R \
            .allure/playwright-results/. \
            .allure/results/ \
            2>/dev/null || true

          cp -R \
            .allure/maestro-results/. \
            .allure/results/ \
            2>/dev/null || true

          echo ""
          echo "Combined result files:"

          find .allure/results \
            -maxdepth 1 \
            -type f \
            -print || true

          COMBINED_COUNT=$(find .allure/results -type f | wc -l)
          echo ""
          echo "Total combined files: $COMBINED_COUNT"

          if [ "$COMBINED_COUNT" -eq 0 ]; then
            echo "::error::No allure result files found after merge. The report will be empty."
          fi

      # ============================================================
      # GENERATE ALLURE
      # ============================================================

      - name: Generate combined Allure report
        if: always()
        run: |

          echo "========================================"
          echo "GENERATE ALLURE REPORT"
          echo "========================================"

          allure generate \
            .allure/results \
            --clean \
            -o .allure/report

      # ============================================================
      # UPLOAD COMBINED RESULTS
      # ============================================================

      - name: Upload combined Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-results
          path: .allure/results/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD COMBINED REPORT
      # ============================================================

      - name: Upload combined Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: .allure/report/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD GITHUB PAGES
      # ============================================================

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .allure/report

  # ================================================================
  # DEPLOY GITHUB PAGES
  # ================================================================

  deploy:
    needs: report

    if: always()

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
