name: Playwright Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}

      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      MAESTRO_PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # GITHUB PAGES
      # ============================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # PLAYWRIGHT DEPENDENCIES
      # ============================================================

      - name: Install Playwright Dependencies
        working-directory: Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # PLAYWRIGHT BROWSERS
      # ============================================================

      - name: Install Playwright Browsers
        working-directory: Playwright
        run: |
          playwright install --with-deps

      # ============================================================
      # MAESTRO PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Maestro Dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # MAESTRO CLI
      # ============================================================

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # ============================================================
      # ALLURE
      # ============================================================

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline
          allure --version

      # ============================================================
      # PREPARE ALLURE DIRECTORIES
      # ============================================================

      - name: Prepare Allure directories
        run: |
          rm -rf .allure

          mkdir -p .allure/playwright-results
          mkdir -p .allure/maestro-results
          mkdir -p .allure/results
          mkdir -p .allure/report

      # ============================================================
      # PLAYWRIGHT
      # ============================================================

      - name: Run Playwright Automation
        id: playwright
        working-directory: Playwright
        continue-on-error: true
        run: |
          pytest -v -s \
            --alluredir=../.allure/playwright-results

      # ============================================================
      # DOWNLOAD MAESTRO APK
      # ============================================================

      - name: Download and verify Maestro APK
        shell: bash
        run: |
          set -euo pipefail

          APK_ZIP="$GITHUB_WORKSPACE/edot-maestro-apk.zip"
          APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "========================================"
          echo "DOWNLOAD MAESTRO APK"
          echo "========================================"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          echo "Downloaded APK ZIP:"
          ls -lh "$APK_ZIP"

          echo "========================================"
          echo "VERIFY SHA-256"
          echo "========================================"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: MAESTRO_APK_SHA256 is empty"
            exit 1
          fi

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_ZIP" \
            | sha256sum --check --status

          echo "SHA-256 verification passed"

          echo "========================================"
          echo "EXTRACT APK"
          echo "========================================"

          unzip -q "$APK_ZIP" -d "$APK_DIR"

          test -f "$APK_DIR/base.apk"
          test -f "$APK_DIR/split_config.arm64_v8a.apk"
          test -f "$APK_DIR/split_config.xxhdpi.apk"

          echo "APK verification passed"

      # ============================================================
      # ENABLE KVM
      # ============================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm

      # ============================================================
      # MAESTRO
      #
      # IMPORTANT:
      # Maestro is currently allowed to fail.
      # This prevents it from blocking the Allure report.
      # ============================================================

      - name: Start emulator and run Maestro
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5

          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |

            set -e

            echo "========================================"
            echo "ANDROID ENVIRONMENT"
            echo "========================================"

            adb devices

            adb wait-for-device

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist


            # ========================================================
            # VERIFY ENVIRONMENT
            # ========================================================

            echo "========================================"
            echo "VERIFY MAESTRO ENVIRONMENT"
            echo "========================================"

            test -n "$APP_ID"
            test -n "$COMPANY_ID"
            test -n "$USER_NAME"
            test -n "$MAESTRO_PASSWORD"

            echo "Environment variables are configured"


            # ========================================================
            # VERIFY APK
            # ========================================================

            echo "========================================"
            echo "VERIFY APK"
            echo "========================================"

            APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

            test -f "$APK_DIR/base.apk"
            test -f "$APK_DIR/split_config.arm64_v8a.apk"
            test -f "$APK_DIR/split_config.xxhdpi.apk"

            ls -lh "$APK_DIR"


            # ========================================================
            # INSTALL APPLICATION
            # ========================================================

            echo "========================================"
            echo "INSTALL APPLICATION"
            echo "========================================"

            adb install-multiple -r \
              "$APK_DIR/base.apk" \
              "$APK_DIR/split_config.arm64_v8a.apk" \
              "$APK_DIR/split_config.xxhdpi.apk"

            echo "Application installed successfully"


            # ========================================================
            # VERIFY PACKAGE
            # ========================================================

            echo "========================================"
            echo "VERIFY PACKAGE"
            echo "========================================"

            adb shell pm path "$APP_ID"


            # ========================================================
            # LAUNCH APPLICATION
            # ========================================================

            echo "========================================"
            echo "LAUNCH APPLICATION"
            echo "========================================"

            adb shell monkey \
              -p "$APP_ID" \
              -c android.intent.category.LAUNCHER \
              1

            sleep 8


            # ========================================================
            # DISABLE AUTOFILL
            # ========================================================

            echo "========================================"
            echo "DISABLE AUTOFILL"
            echo "========================================"

            adb shell settings put secure autofill_service null || true

            echo "Autofill disabled"


            # ========================================================
            # RUN MAESTRO
            # ========================================================

            echo "========================================"
            echo "RUN MAESTRO TEST"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/Maestro"

            pytest -v -s \
              pytest/test_mobile.py \
              --alluredir="$GITHUB_WORKSPACE/.allure/maestro-results"

      # ============================================================
      # SHOW MAESTRO DEBUG
      # ============================================================

      - name: Show Maestro debug files
        if: always()
        run: |
          echo "========================================"
          echo "MAESTRO DEBUG FILES"
          echo "========================================"

          if [ -d "$HOME/.maestro" ]; then
            find "$HOME/.maestro" \
              -maxdepth 4 \
              -type f \
              -print
          else
            echo "No Maestro debug directory found"
          fi

      # ============================================================
      # MERGE ALLURE RESULTS
      # ============================================================

      - name: Merge Allure results
        if: always()
        run: |
          echo "========================================"
          echo "MERGE ALLURE RESULTS"
          echo "========================================"

          rm -rf .allure/results
          mkdir -p .allure/results

          if [ -d ".allure/playwright-results" ]; then
            cp -R .allure/playwright-results/. .allure/results/ || true
          fi

          if [ -d ".allure/maestro-results" ]; then
            cp -R .allure/maestro-results/. .allure/results/ || true
          fi

          echo ""
          echo "Combined Allure results:"
          find .allure/results -maxdepth 1 -type f -print || true

      # ============================================================
      # GENERATE COMBINED ALLURE REPORT
      # ============================================================

      - name: Generate combined Allure report
        if: always()
        run: |
          echo "========================================"
          echo "GENERATE COMBINED ALLURE REPORT"
          echo "========================================"

          rm -rf .allure/report

          allure generate \
            .allure/results \
            --clean \
            -o .allure/report

      # ============================================================
      # UPLOAD ALLURE RESULTS
      # ============================================================

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-results
          path: .allure/results/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD COMBINED ALLURE REPORT
      # ============================================================

      - name: Upload Combined Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-allure-report
          path: .allure/report/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD MAESTRO EVIDENCE
      # ============================================================

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

      # ============================================================
      # UPLOAD MAESTRO DEBUG
      # ============================================================

      - name: Upload Maestro debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: /home/runner/.maestro/
          include-hidden-files: true
          if-no-files-found: warn

      # ============================================================
      # UPLOAD GITHUB PAGES
      # ============================================================

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .allure/report

      # ============================================================
      # REPORT STATUS
      # ============================================================

      - name: Report execution status
        if: always()
        run: |
          echo "========================================"
          echo "AUTOMATION SUMMARY"
          echo "========================================"

          echo "Playwright result: ${{ steps.playwright.outcome }}"
          echo "Maestro result:    ${{ steps.maestro.outcome }}"

          echo ""
          echo "Allure report contains:"
          echo "- Playwright results"
          echo "- Maestro results when available"

          echo "========================================"

  # ================================================================
  # DEPLOY GITHUB PAGES
  # ================================================================

  deploy:
    needs: automation
    if: always()
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
