name: Maestro Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # Java
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # Python dependencies
      # ============================================================
      - name: Install Python dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # Maestro
      # ============================================================
      - name: Install Maestro 2.6.1
        run: |
          export MAESTRO_VERSION=2.6.1

          curl -Ls https://get.maestro.mobile.dev | bash

          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

          "$HOME/.maestro/bin/maestro" --version

      # ============================================================
      # Allure
      # ============================================================
      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline --save-dev

          allure --version

      # ============================================================
      # Download APK
      # ============================================================
      - name: Download and verify APK package
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Prepare APK"
          echo "========================================"

          APK_ZIP="$RUNNER_TEMP/edot-maestro-apk.zip"
          APK_DIR="$RUNNER_TEMP/edot-apk"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if ! [[ "$APK_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "ERROR: MAESTRO_APK_SHA256 harus berisi SHA-256 64 karakter hex"
            exit 1
          fi

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "Downloading APK package..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          echo "APK downloaded successfully"

          ls -lh "$APK_ZIP"

          echo "========================================"
          echo "Verify SHA-256"
          echo "========================================"

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_ZIP" \
            | sha256sum --check --status

          echo "SHA-256 verification passed"

          echo "========================================"
          echo "Extract APK"
          echo "========================================"

          unzip -q "$APK_ZIP" -d "$APK_DIR"

          echo "APK files:"
          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -printf "%f\n" \
            | sort

          echo "========================================"
          echo "Verify required APK files"
          echo "========================================"

          test -f "$APK_DIR/base.apk"
          test -f "$APK_DIR/split_config.arm64_v8a.apk"
          test -f "$APK_DIR/split_config.xxhdpi.apk"

          echo "All required APK files are available"

      # ============================================================
      # KVM
      # ============================================================
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo "KVM:"
          ls -la /dev/kvm

      # ============================================================
      # Emulator + Maestro
      # ============================================================
      - name: Start emulator and run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5

          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |
            set -e

            echo "========================================"
            echo "Android Emulator Information"
            echo "========================================"

            adb devices

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist

            echo "========================================"
            echo "Emulator is ready"
            echo "========================================"

            sleep 5

            # ========================================================
            # Install application
            # ========================================================

            echo "========================================"
            echo "Install application"
            echo "========================================"

            APK_DIR="$RUNNER_TEMP/edot-apk"

            echo "APK directory:"
            echo "$APK_DIR"

            echo "APK contents:"
            ls -lah "$APK_DIR"

            test -f "$APK_DIR/base.apk"
            test -f "$APK_DIR/split_config.arm64_v8a.apk"
            test -f "$APK_DIR/split_config.xxhdpi.apk"

            adb install-multiple -r \
              "$APK_DIR/base.apk" \
              "$APK_DIR/split_config.arm64_v8a.apk" \
              "$APK_DIR/split_config.xxhdpi.apk"

            echo "Application installed successfully"

            # ========================================================
            # Verify package
            # ========================================================

            echo "========================================"
            echo "Verify package"
            echo "========================================"

            adb shell pm path "$APP_ID"

            # ========================================================
            # Launch application
            # ========================================================

            echo "========================================"
            echo "Launch application"
            echo "========================================"

            adb shell monkey \
              -p "$APP_ID" \
              -c android.intent.category.LAUNCHER \
              1

            echo "Application launched"

            sleep 8

            # ========================================================
            # Verify Maestro project
            # ========================================================

            echo "========================================"
            echo "Verify Maestro project"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/Maestro"

            echo "Current directory:"
            pwd

            echo "Project files:"
            find . -maxdepth 2 -type f | sort

            # ========================================================
            # Verify pytest
            # ========================================================

            echo "========================================"
            echo "Verify pytest"
            echo "========================================"

            echo "Python:"
            python --version

            echo "Pytest:"
            pytest --version

            echo "Test file:"
            test -f pytest/test_mobile.py

            echo "pytest/test_mobile.py found"

            # ========================================================
            # Run Maestro automation
            # ========================================================

            echo "========================================"
            echo "Run Maestro automation"
            echo "========================================"

            pytest -v -s pytest/test_mobile.py

      # ============================================================
      # Generate Allure report
      # ============================================================
      - name: Generate Allure report
        if: always()
        run: |
          echo "========================================"
          echo "Generate Allure report"
          echo "========================================"

          if [ -d "Maestro/allure-results" ] && \
             find Maestro/allure-results \
             -name '*-result.json' \
             -print -quit \
             | grep -q .; then

            allure generate \
              Maestro/allure-results \
              --clean \
              -o Maestro/allure-report

          else
            echo "No Allure results found."
          fi

      # ============================================================
      # Upload Allure results
      # ============================================================
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: Maestro/allure-results/
          if-no-files-found: warn

      # ============================================================
      # Upload Maestro evidence
      # ============================================================
      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
            Maestro/pytest/
          if-no-files-found: warn

      # ============================================================
      # Upload Allure report
      # ============================================================
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-report
          path: Maestro/allure-report/
          if-no-files-found: warn
