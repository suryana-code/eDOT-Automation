name: Maestro Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # MAESTRO CLI
      # ============================================================

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # ============================================================
      # ALLURE
      # ============================================================

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline
          allure --version

      # ============================================================
      # DOWNLOAD APK
      # ============================================================

      - name: Download and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_ZIP="$GITHUB_WORKSPACE/edot-maestro-apk.zip"
          APK_DIR="$GITHUB_WORKSPACE/.ci/edot-apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "========================================"
          echo "DOWNLOAD APK"
          echo "========================================"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$APK_ZIP" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          echo "Downloaded ZIP:"
          ls -lh "$APK_ZIP"


          echo "========================================"
          echo "VERIFY SHA-256"
          echo "========================================"

          APK_SHA256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if [ -z "$APK_SHA256" ]; then
            echo "ERROR: MAESTRO_APK_SHA256 is empty"
            exit 1
          fi

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_ZIP" \
            | sha256sum --check --status

          echo "SHA-256 verification passed"


          echo "========================================"
          echo "EXTRACT APK"
          echo "========================================"

          unzip -q "$APK_ZIP" -d "$APK_DIR"

          echo "Extracted files:"
          find "$APK_DIR" -maxdepth 1 -type f -print


          echo "========================================"
          echo "VERIFY APK FILES"
          echo "========================================"

          test -f "$APK_DIR/base.apk"
          test -f "$APK_DIR/split_config.arm64_v8a.apk"
          test -f "$APK_DIR/split_config.xxhdpi.apk"

          echo "All APK files exist."

          ls -lh \
            "$APK_DIR/base.apk" \
            "$APK_DIR/split_config.arm64_v8a.apk" \
            "$APK_DIR/split_config.xxhdpi.apk"

      # ============================================================
      # ENABLE KVM
      # ============================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm

      # ============================================================
      # START EMULATOR + MAESTRO
      # ============================================================

      - name: Start emulator and run Maestro
        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5

          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |

            echo "========================================"
            echo "ANDROID ENVIRONMENT"
            echo "========================================"

            adb devices

            adb wait-for-device

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist


            # ========================================================
            # VERIFY ENVIRONMENT
            # ========================================================

            echo "========================================"
            echo "VERIFY ENVIRONMENT"
            echo "========================================"

            test -n "$APP_ID"

            test -n "$COMPANY_ID"

            test -n "$USER_NAME"

            test -n "$PASSWORD"

            echo "Environment variables are configured"


            # ========================================================
            # VERIFY APK DIRECTORY
            #
            # IMPORTANT:
            # Do NOT assign APK_DIR here.
            # android-emulator-runner executes script commands
            # independently.
            # ========================================================

            echo "========================================"
            echo "VERIFY APK DIRECTORY"
            echo "========================================"

            echo "GITHUB_WORKSPACE:"
            echo "$GITHUB_WORKSPACE"

            echo "APK DIRECTORY:"
            echo "$GITHUB_WORKSPACE/.ci/edot-apk"

            echo "APK directory contents:"

            ls -lah "$GITHUB_WORKSPACE/.ci/edot-apk"


            # ========================================================
            # VERIFY APK FILES
            # ========================================================

            echo "========================================"
            echo "VERIFY APK FILES"
            echo "========================================"

            echo "Checking base.apk"

            test -f "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk"

            echo "Checking split_config.arm64_v8a.apk"

            test -f "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.arm64_v8a.apk"

            echo "Checking split_config.xxhdpi.apk"

            test -f "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk"

            echo "All APK files are accessible."


            # ========================================================
            # INSTALL APPLICATION
            # ========================================================

            echo "========================================"
            echo "INSTALL APPLICATION"
            echo "========================================"

            adb install-multiple -r "$GITHUB_WORKSPACE/.ci/edot-apk/base.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.arm64_v8a.apk" "$GITHUB_WORKSPACE/.ci/edot-apk/split_config.xxhdpi.apk"

            echo "Application installed successfully"


            # ========================================================
            # VERIFY PACKAGE
            # ========================================================

            echo "========================================"
            echo "VERIFY PACKAGE"
            echo "========================================"

            adb shell pm path "$APP_ID"


            # ========================================================
            # LAUNCH APPLICATION
            # ========================================================

            echo "========================================"
            echo "LAUNCH APPLICATION"
            echo "========================================"

            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1

            echo "Application launched"

            sleep 8


            # ========================================================
            # DISABLE AUTOFILL
            # ========================================================

            echo "========================================"
            echo "DISABLE AUTOFILL"
            echo "========================================"

            adb shell settings put secure autofill_service null || true

            echo "Autofill disabled"


            # ========================================================
            # VERIFY MAESTRO PROJECT
            # ========================================================

            echo "========================================"
            echo "VERIFY MAESTRO PROJECT"
            echo "========================================"

            test -d "$GITHUB_WORKSPACE/Maestro"

            test -f "$GITHUB_WORKSPACE/Maestro/Makefile"

            test -f "$GITHUB_WORKSPACE/Maestro/pytest/test_mobile.py"

            echo "Maestro project verified"


            # ========================================================
            # PYTHON / PYTEST
            # ========================================================

            echo "========================================"
            echo "PYTHON / PYTEST"
            echo "========================================"

            python --version

            pytest --version


            # ========================================================
            # RUN MAESTRO
            # ========================================================

            echo "========================================"
            echo "RUN MAESTRO TEST"
            echo "========================================"

            make -C "$GITHUB_WORKSPACE/Maestro" test

      # ============================================================
      # MAESTRO DEBUG FILES
      # ============================================================

      - name: Show Maestro debug files
        if: always()
        run: |
          echo "========================================"
          echo "MAESTRO DEBUG FILES"
          echo "========================================"

          if [ -d "$HOME/.maestro" ]; then
            find "$HOME/.maestro" \
              -maxdepth 4 \
              -type f \
              -print
          else
            echo "No Maestro debug directory found"
          fi

      # ============================================================
      # ALLURE REPORT
      # ============================================================

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "Maestro/allure-results" ] && \
             find Maestro/allure-results \
             -name '*-result.json' \
             -print -quit | grep -q .; then

            allure generate \
              Maestro/allure-results \
              --clean \
              -o Maestro/allure-report

          else
            echo "No Allure results found."
          fi

      # ============================================================
      # UPLOAD ALLURE RESULTS
      # ============================================================

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: Maestro/allure-results/
          if-no-files-found: warn

      # ============================================================
      # UPLOAD MAESTRO EVIDENCE
      # ============================================================

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

      # ============================================================
      # UPLOAD MAESTRO DEBUG
      # ============================================================

      - name: Upload Maestro debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: /home/runner/.maestro/
          include-hidden-files: true
          if-no-files-found: warn

      # ============================================================
      # UPLOAD ALLURE REPORT
      # ============================================================

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-report
          path: Maestro/allure-report/
          if-no-files-found: warn
