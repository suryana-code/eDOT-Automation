name: Maestro Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Maestro 2.6.1
        run: |
          export MAESTRO_VERSION=2.6.1
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version | grep -Fx "2.6.1"

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline --save-dev

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm

      - name: Start emulator and run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |
            echo "========================================"
            echo "Android Emulator Information"
            echo "========================================"

            adb devices

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist

            echo "========================================"
            echo "Prepare APK"
            echo "========================================"

            mkdir -p /tmp/edot-apk

            echo "Downloading APK package..."

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --output /tmp/edot-maestro-apk.zip \
              https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip

            echo "APK package downloaded."

            ls -lh /tmp/edot-maestro-apk.zip

            echo "========================================"
            echo "Verify SHA-256"
            echo "========================================"

            printf '%s  %s\n' \
              "$MAESTRO_APK_SHA256" \
              /tmp/edot-maestro-apk.zip \
              | sha256sum --check --status

            echo "SHA-256 verification passed."

            echo "========================================"
            echo "Extract APK"
            echo "========================================"

            unzip -q \
              /tmp/edot-maestro-apk.zip \
              -d /tmp/edot-apk

            echo "APK files:"

            find /tmp/edot-apk \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -printf '%f\n' \
              | sort

            test -f /tmp/edot-apk/base.apk
            test -f /tmp/edot-apk/split_config.arm64_v8a.apk
            test -f /tmp/edot-apk/split_config.xxhdpi.apk

            echo "========================================"
            echo "Install application"
            echo "========================================"

            adb install-multiple -r \
              /tmp/edot-apk/base.apk \
              /tmp/edot-apk/split_config.arm64_v8a.apk \
              /tmp/edot-apk/split_config.xxhdpi.apk

            echo "========================================"
            echo "Verify package"
            echo "========================================"

            adb shell pm path "$APP_ID"

            echo "========================================"
            echo "Launch application"
            echo "========================================"

            adb shell monkey \
              -p "$APP_ID" \
              -c android.intent.category.LAUNCHER \
              1

            sleep 5

            echo "========================================"
            echo "Run Maestro automation"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/Maestro"

            make test

      - name: Generate Allure report
        if: always()
        run: |
          if find Maestro/allure-results \
            -name '*-result.json' \
            -print -quit \
            | grep -q .; then

            allure generate \
              Maestro/allure-results \
              --clean \
              -o Maestro/allure-report \
              || echo "Allure report generation failed."

          else
            echo "No Allure results found."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: Maestro/allure-results/
          if-no-files-found: warn

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-report
          path: Maestro/allure-report/
          if-no-files-found: warn
