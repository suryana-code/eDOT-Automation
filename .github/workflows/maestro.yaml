name: Maestro Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Maestro 2.6.1
        run: |
          export MAESTRO_VERSION=2.6.1
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

          "$HOME/.maestro/bin/maestro" --version | grep -Fx "2.6.1"

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline --save-dev

      - name: Download and verify APK package
        run: |
          set -euo pipefail

          apk_zip="$RUNNER_TEMP/edot-maestro-apk.zip"
          apk_dir="$RUNNER_TEMP/edot-apk"

          apk_sha256="$(printf '%s' "$MAESTRO_APK_SHA256" | tr -d '[:space:]')"

          if ! [[ "$apk_sha256" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "Invalid MAESTRO_APK_SHA256"
            exit 1
          fi

          rm -rf "$apk_dir"
          mkdir -p "$apk_dir"

          echo "Downloading APK package..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --output "$apk_zip" \
            "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          echo "Verifying SHA-256..."

          printf '%s  %s\n' \
            "$apk_sha256" \
            "$apk_zip" \
            | sha256sum --check --status

          echo "SHA-256 verification passed"

          echo "Extracting APK..."

          unzip -q "$apk_zip" -d "$apk_dir"

          echo "APK files:"
          find "$apk_dir" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -printf '%f\n' \
            | sort

          test -f "$apk_dir/base.apk"
          test -f "$apk_dir/split_config.arm64_v8a.apk"
          test -f "$apk_dir/split_config.xxhdpi.apk"

          echo "APK validation passed"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          ls -la /dev/kvm

      - name: Start emulator and run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5

          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |
            set -e

            echo "========================================"
            echo "Android Emulator Information"
            echo "========================================"

            adb wait-for-device

            echo "ADB devices:"
            adb devices

            echo "SDK:"
            adb shell getprop ro.build.version.sdk

            echo "Primary ABI:"
            adb shell getprop ro.product.cpu.abi

            echo "Supported ABIs:"
            adb shell getprop ro.product.cpu.abilist

            echo "========================================"
            echo "Wait for Android boot"
            echo "========================================"

            timeout 120 sh -c '
              until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
                echo "Waiting for Android boot..."
                sleep 2
              done
            '

            echo "Android boot completed"

            echo "========================================"
            echo "Prepare emulator"
            echo "========================================"

            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true

            echo "========================================"
            echo "Install application"
            echo "========================================"

            adb install-multiple -r \
              "$RUNNER_TEMP/edot-apk/base.apk" \
              "$RUNNER_TEMP/edot-apk/split_config.arm64_v8a.apk" \
              "$RUNNER_TEMP/edot-apk/split_config.xxhdpi.apk"

            echo "========================================"
            echo "Verify package"
            echo "========================================"

            adb shell pm path "$APP_ID"

            echo "========================================"
            echo "Launch application"
            echo "========================================"

            adb shell am force-stop "$APP_ID" || true

            adb shell monkey \
              -p "$APP_ID" \
              -c android.intent.category.LAUNCHER \
              1

            echo "Waiting for application to become ready..."
            sleep 8

            echo "========================================"
            echo "Application state"
            echo "========================================"

            adb shell dumpsys activity activities \
              | grep -E "mResumedActivity|mFocusedApp" \
              || true

            echo "========================================"
            echo "Run Maestro automation"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/Maestro"

            PYTHONUNBUFFERED=1 make test

      - name: Generate Allure report
        if: always()
        run: |
          if find Maestro/allure-results \
            -name '*-result.json' \
            -print -quit \
            | grep -q .; then

            allure generate \
              Maestro/allure-results \
              --clean \
              -o Maestro/allure-report \
              || echo "Allure report generation failed."

          else
            echo "No Allure results found."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: Maestro/allure-results/
          if-no-files-found: warn

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
            /home/runner/.maestro/tests/
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-report
          path: Maestro/allure-report/
          if-no-files-found: warn
