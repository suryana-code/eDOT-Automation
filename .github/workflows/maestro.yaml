name: Maestro Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.MAESTRO_APP_ID }}
      COMPANY_ID: ${{ secrets.MAESTRO_COMPANY_ID }}
      USER_NAME: ${{ secrets.MAESTRO_USER_NAME }}
      PASSWORD: ${{ secrets.MAESTRO_PASSWORD }}
      MAESTRO_APK_SHA256: ${{ secrets.MAESTRO_APK_SHA256 }}

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Python
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # ============================================================
      # Java
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ============================================================
      # Python dependencies
      # ============================================================

      - name: Install Python dependencies
        working-directory: Maestro
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # Install Maestro
      # ============================================================

      - name: Install Maestro 2.6.1
        run: |
          export MAESTRO_VERSION=2.6.1
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # ============================================================
      # Install Allure
      # ============================================================

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline --save-dev
          allure --version

      # ============================================================
      # Download APK
      # ============================================================

      - name: Download and verify APK package
        run: |
          set -e

          APK_ZIP="$RUNNER_TEMP/edot-maestro-apk.zip"
          APK_DIR="$RUNNER_TEMP/edot-apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "Downloading APK..."

          curl --fail --location --retry 3 --retry-all-errors --output "$APK_ZIP" "https://github.com/suryana-code/eDOT-Automation/releases/download/maestro-ci-v1/edot-maestro-apk.zip"

          echo "Verifying SHA-256..."

          printf '%s  %s\n' "$MAESTRO_APK_SHA256" "$APK_ZIP" | sha256sum --check --status

          echo "SHA-256 verification passed"

          echo "Extracting APK..."

          unzip -q "$APK_ZIP" -d "$APK_DIR"

          echo "APK files:"

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

          test -f "$APK_DIR/base.apk"
          test -f "$APK_DIR/split_config.arm64_v8a.apk"
          test -f "$APK_DIR/split_config.xxhdpi.apk"

          echo "All APK files are available"

      # ============================================================
      # Enable KVM
      # ============================================================

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      # ============================================================
      # Start emulator and run Maestro
      # ============================================================

      - name: Start emulator and run Maestro
        uses: reactivecircus/android-emulator-runner@v2

        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 600

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-snapshot-save

          script: |
            echo "========================================"
            echo "ANDROID ENVIRONMENT"
            echo "========================================"

            adb devices

            adb shell getprop ro.build.version.sdk

            adb shell getprop ro.product.cpu.abi

            adb shell getprop ro.product.cpu.abilist

            echo "========================================"
            echo "VERIFY ENVIRONMENT"
            echo "========================================"

            test -n "$APP_ID"

            test -n "$COMPANY_ID"

            test -n "$USER_NAME"

            test -n "$PASSWORD"

            echo "APP_ID configured"

            echo "COMPANY_ID configured"

            echo "USER_NAME configured"

            echo "PASSWORD configured"

            echo "========================================"
            echo "VERIFY APK"
            echo "========================================"

            echo "$RUNNER_TEMP/edot-apk"

            ls -lah "$RUNNER_TEMP/edot-apk"

            test -f "$RUNNER_TEMP/edot-apk/base.apk"

            test -f "$RUNNER_TEMP/edot-apk/split_config.arm64_v8a.apk"

            test -f "$RUNNER_TEMP/edot-apk/split_config.xxhdpi.apk"

            echo "========================================"
            echo "INSTALL APPLICATION"
            echo "========================================"

            adb install-multiple -r "$RUNNER_TEMP/edot-apk/base.apk" "$RUNNER_TEMP/edot-apk/split_config.arm64_v8a.apk" "$RUNNER_TEMP/edot-apk/split_config.xxhdpi.apk"

            echo "Application installed successfully"

            echo "========================================"
            echo "VERIFY PACKAGE"
            echo "========================================"

            adb shell pm path "$APP_ID"

            echo "========================================"
            echo "LAUNCH APPLICATION"
            echo "========================================"

            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1

            echo "Application launched"

            sleep 8

            echo "========================================"
            echo "VERIFY MAESTRO PROJECT"
            echo "========================================"

            cd "$GITHUB_WORKSPACE/Maestro"

            pwd

            ls -lah

            ls -lah pytest

            test -f pytest/test_mobile.py

            echo "========================================"
            echo "PYTHON / PYTEST"
            echo "========================================"

            python --version

            pytest --version

            echo "========================================"
            echo "RUN MAESTRO AUTOMATION"
            echo "========================================"

            python -m pytest -vv -s pytest/test_mobile.py

      # ============================================================
      # Generate Allure report
      # ============================================================

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "Maestro/allure-results" ]; then
            allure generate Maestro/allure-results --clean -o Maestro/allure-report || true
          else
            echo "No Allure results directory found."
          fi

      # ============================================================
      # Upload Allure results
      # ============================================================

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-results
          path: Maestro/allure-results/
          if-no-files-found: warn

      # ============================================================
      # Upload Maestro evidence
      # ============================================================

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-evidence
          path: |
            Maestro/recordings/
            Maestro/*.log
          if-no-files-found: warn

      # ============================================================
      # Upload Maestro debug
      # ============================================================

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: /home/runner/.maestro/
          if-no-files-found: warn

      # ============================================================
      # Upload Allure report
      # ============================================================

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-allure-report
          path: Maestro/allure-report/
          if-no-files-found: warn
