appId: ${APP_ID}
onFlowStart:
  - startRecording:
      path: "recordings/${MAESTRO_EVIDENCE_RUN_ID}/maestro-execution"
      label: "Capture Maestro execution for Allure evidence"
      optional: true
onFlowComplete:
  - stopRecording
---
- launchApp:
    clearState: true
- runFlow:
    file: login/login.yaml
- runFlow:
    file: customer/create_customer.yaml
- runFlow:
    file: customer/verify_customer.yaml
