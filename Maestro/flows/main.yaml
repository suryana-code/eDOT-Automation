# eWork SFA Orchestration Flow - Author: 5urY4n4 (Sury@n@)
appId: ${APP_ID}
onFlowStart:
  - startRecording:
      path: "recordings/${MAESTRO_EVIDENCE_RUN_ID}/maestro-execution"
      label: "Capture Maestro execution for Allure evidence"
      optional: true
onFlowComplete:
  - stopRecording

---
- launchApp:
    clearState: true

- runFlow:
    file: login/login.yaml
- takeScreenshot:
    path: "login-dashboard"
    label: "Dashboard setelah login"

- runFlow:
    file: customer/create_customer.yaml

- runFlow:
    file: customer/verify_customer.yaml
- takeScreenshot:
    path: "new-customer-list"
    label: "Customer baru pada New Customer List"
