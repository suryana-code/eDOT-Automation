appId: id.edot.ework

env:
  COMPANY_ID: "5049209"
  USER_NAME: "salesmanqaauto"
  PASSWORD: "it.QA2025"

  OUTLET_NAME: "QA Outlet"
  PHONE: "81234567890"
  EMAIL: "qa@test.com"
  CONTACT_PERSON: "QA Automation"

  CHANNEL: "Modern Trade (MT)"
  OUTLET_TYPE: "Grosir"

  ADDRESS_TYPE: "Delivery Address"

  ADDRESS: "Jl. Test Automation"

  PROVINCE: "RIAU"
  CITY: "KAB KAMPAR"
  DISTRICT: "BANGKINANG KOTA"
  SUBDISTRICT: "KUMANTAN"

  KTP: "3201234567890001"

---
- assertVisible: "New Customer"

- tapOn: "New Customer"

- extendedWaitUntil:
    visible: "New Customer Registration"
    timeout: 10000

- tapOn: "New Customer Registration"

- tapOn:
    id: noo_registration_input_outlet_name

- inputText: ${OUTLET_NAME}

- tapOn:
    id: noo_registration_input_phone

- inputText: ${PHONE}

- hideKeyboard

- tapOn:
    id: noo_registration_input_email

- inputText: ${EMAIL}

- hideKeyboard

- tapOn:
    id: noo_registration_input_contact_person

- inputText: ${CONTACT_PERSON}

- hideKeyboard

- tapOn:
    id: noo_registration_input_channel

- tapOn: ${CHANNEL}

- tapOn:
    id: noo_registration_input_outlet_type

- tapOn: Search

- inputText: ${OUTLET_TYPE}

- tapOn:
    text: ${OUTLET_TYPE}
    index: 1

- tapOn:
    id: noo_registration_input_address_type

- tapOn: ${ADDRESS_TYPE}

- tapOn:
    id: noo_registration_input_address

- inputText: ${ADDRESS}

- tapOn: Choose Province

- tapOn: ${PROVINCE}

- tapOn: Choose City

- tapOn: ${CITY}

- tapOn: Choose District

- tapOn: ${DISTRICT}

- tapOn: Choose Sub district

- tapOn: ${SUBDISTRICT}

- tapOn: Input KTP

- inputText: ${KTP}

- tapOn:
    id: "signature_view"
- swipe:
    start: 20%,50%
    end: 80%,50%

- swipe:
    start: 30%,30%
    end: 70%,70%
