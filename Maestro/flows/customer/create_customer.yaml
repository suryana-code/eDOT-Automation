appId: id.edot.ework
---
- assertVisible: "New Customer"

- tapOn: "New Customer"

- extendedWaitUntil:
    visible: "New Customer Registration"
    timeout: 10000

- tapOn: "New Customer Registration"

# Basic Information
- tapOn:
    id: noo_registration_input_outlet_name

- inputText: ${OUTLET_NAME}

- tapOn:
    id: noo_registration_input_phone

- inputText: ${PHONE}

- tapOn:
    id: noo_registration_input_email

- inputText: ${EMAIL}

- tapOn:
    id: noo_registration_input_contact_person

- inputText: ${CONTACT_PERSON}

- swipe:
    direction: UP

# Channel
- tapOn:
    id: noo_registration_input_channel

- tapOn: ${CHANNEL}

# Outlet Type
- tapOn:
    id: noo_registration_input_outlet_type

- tapOn: "Search"

- inputText: ${OUTLET_TYPE}

- tapOn:
    text: ${OUTLET_TYPE}
    index: 1

- tapOn: "Continue"

# Store Information
- extendedWaitUntil:
    visible: "Store Information"
    timeout: 10000

- tapOn:
    id: noo_registration_input_address_type

- tapOn: ${ADDRESS_TYPE}

- tapOn:
    id: noo_registration_input_address

- inputText: ${ADDRESS}

- swipe:
    direction: UP

# Location
- tapOn: "Choose Province"
- tapOn: ${PROVINCE}

- tapOn: "Choose City"
- tapOn: ${CITY}

- tapOn: "Choose District"
- tapOn: ${DISTRICT}

- tapOn: "Choose Sub district"
- tapOn: ${SUBDISTRICT}

- tapOn: "Continue"

# Documents
- extendedWaitUntil:
    visible: "KTP *"
    timeout: 10000

- tapOn: "Input KTP"
- inputText: ${KTP}

- tapOn: "Upload File"

- tapOn:
    id: "btn_capture"

- tapOn: "Submit"

# Approval Signature
- tapOn:
    id: "signature_view"

# Signature stroke 1
- swipe:
    start: 20%,76%
    end: 35%,70%
    duration: 400

# Signature stroke 2
- swipe:
    start: 35%,70%
    end: 45%,79%
    duration: 400

# Signature stroke 3
- swipe:
    start: 45%,79%
    end: 55%,69%
    duration: 400

# Signature stroke 4
- swipe:
    start: 55%,69%
    end: 70%,77%
    duration: 400

- tapOn: "Register"

- extendedWaitUntil:
    visible: "Are you sure to save this customer data?"
    timeout: 10000

- tapOn: "Yes"

# Tier 2 - verify creation outcome
- extendedWaitUntil:
    visible: "Data Saved Successfully"
    timeout: 15000

- assertVisible: "Data Saved Successfully"

- tapOn: "Continue"

# Customer List
- extendedWaitUntil:
    visible: "New Customer List"
    timeout: 15000

- scrollUntilVisible:
    element: "${OUTLET_NAME}"
    direction: DOWN
    timeout: 60000
    speed: 60
    visibilityPercentage: 50
    centerElement: true

# Tier 2 - verify created data
- assertVisible: "${OUTLET_NAME}"
