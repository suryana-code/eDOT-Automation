appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "New Customer"
    timeout: 15000

- tapOn: "New Customer"

- extendedWaitUntil:
    visible: "New Customer Registration"
    timeout: 10000

- tapOn: "New Customer Registration"

# Informasi dasar customer
- tapOn:
    id: noo_registration_input_outlet_name

- inputText: ${OUTLET_NAME}

- tapOn:
    id: noo_registration_input_phone

- inputText: ${PHONE}

- tapOn:
    id: noo_registration_input_email

- inputText: ${EMAIL}

- scrollUntilVisible:
    element:
      id: noo_registration_input_contact_person
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50

- tapOn:
    id: noo_registration_input_contact_person

- inputText: ${CONTACT_PERSON}

- swipe:
    direction: UP

# Pilihan channel customer
- tapOn:
    id: noo_registration_input_channel

- tapOn: ${CHANNEL}

- scrollUntilVisible:
    element:
      id: noo_registration_input_outlet_type
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50

# Pilihan tipe outlet
- tapOn:
    id: noo_registration_input_outlet_type

- tapOn: "Search"

- inputText: ${OUTLET_TYPE}

- tapOn:
    text: ${OUTLET_TYPE}
    index: 1

- tapOn: "Continue"

# Informasi toko
- extendedWaitUntil:
    visible: "Store Information"
    timeout: 10000

- tapOn:
    id: noo_registration_input_address_type

- tapOn: ${ADDRESS_TYPE}

- tapOn:
    id: noo_registration_input_address

- inputText: ${ADDRESS}

- swipe:
    direction: UP

# Cascade lokasi customer
- tapOn: "Choose Province"
- tapOn: ${PROVINCE}

- tapOn: "Choose City"
- tapOn: ${CITY}

- tapOn: "Choose District"
- tapOn: ${DISTRICT}

- tapOn: "Choose Sub district"
- tapOn: ${SUBDISTRICT}

- tapOn: "Continue"

# Dokumen customer
- extendedWaitUntil:
    visible: "KTP *"
    timeout: 10000

- tapOn: "Input KTP"
- inputText: ${KTP}

- tapOn: "Upload File"

- tapOn:
    id: "btn_capture"

- tapOn: "Submit"

# Tanda tangan persetujuan
- tapOn:
    id: "signature_view"

# Swipe berbasis koordinat adalah pilihan terakhir: pad tanda tangan memerlukan
# gestur tulisan tangan dan tidak menyediakan selector untuk membuat goresan.
# Goresan tanda tangan 1
- swipe:
    start: 20%,76%
    end: 35%,70%
    duration: 400

# Goresan tanda tangan 2
- swipe:
    start: 35%,70%
    end: 45%,79%
    duration: 400

# Goresan tanda tangan 3
- swipe:
    start: 45%,79%
    end: 55%,69%
    duration: 400

# Goresan tanda tangan 4
- swipe:
    start: 55%,69%
    end: 70%,77%
    duration: 400

- tapOn: "Register"

- extendedWaitUntil:
    visible: "Are you sure to save this customer data?"
    timeout: 10000

- tapOn: "Yes"

# Tier 2: cek notifikasi customer berhasil dibuat
- extendedWaitUntil:
    visible: "Data Saved Successfully"
    timeout: 15000

- assertVisible: "Data Saved Successfully"

- tapOn: "Continue"
