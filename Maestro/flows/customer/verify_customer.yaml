appId: ${APP_ID}
---
# Customer List
- extendedWaitUntil:
    visible: "New Customer List"
    timeout: 15000

- scrollUntilVisible:
    element: "${OUTLET_NAME}"
    direction: DOWN
    timeout: 80000
    speed: 60
    visibilityPercentage: 50
    centerElement: true

# Tier 2 - verify observable values from the newly created customer card.
# The list has no customer-detail page; name and address are the actual input
# values displayed reliably after scrollUntilVisible finds this customer.
- assertVisible: "${OUTLET_NAME}"
# Customer ID is generated by the application. "Waiting for Approval" is not
# asserted because the list can show that same status on other customer cards;
# asserting it without a card-level selector would be a false positive.
