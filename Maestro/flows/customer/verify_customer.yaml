appId: ${APP_ID}
---
# Daftar customer baru
- extendedWaitUntil:
    visible: "New Customer List"
    timeout: 15000

- tapOn: "Waiting for Approval"

- scrollUntilVisible:
    element: "${OUTLET_NAME}"
    direction: DOWN
    timeout: 100000
    speed: 60
    visibilityPercentage: 50
    centerElement: true

# Tier 2: cek OUTLET_NAME pada card customer baru
# Address tidak diassert karena tidak reliable pada card
- assertVisible: "${OUTLET_NAME}"
# ID dibuat aplikasi; status tidak diassert karena bukan selector tingkat card
