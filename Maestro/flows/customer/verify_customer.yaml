appId: ${APP_ID}
---
# Customer List
- extendedWaitUntil:
    visible: "New Customer List"
    timeout: 15000

- scrollUntilVisible:
    element: "${OUTLET_NAME}"
    direction: DOWN
    timeout: 60000
    speed: 60
    visibilityPercentage: 50
    centerElement: true

# Verify created data
- assertVisible: "${OUTLET_NAME}"
