appId: id.edot.ework
---
- extendedWaitUntil:
    visible: "Ex: P104"
    timeout: 10000

- tapOn: "Ex: P104"
- inputText: ${COMPANY_ID}

- tapOn: "Ex: sfa-131600"
- inputText: ${USER_NAME}

- tapOn: "Enter password"
- inputText: ${PASSWORD}

- hideKeyboard

- tapOn: "Sign In"

- extendedWaitUntil:
    visible: "Ranking currently unavailable"
    timeout: 15000

- assertVisible: "Ranking currently unavailable"
